---
- name: install gcompat
  apk:
    name: gcompat
    update_cache: true
- name: install pytz
  apk:
    name: py3-tz
- name: install waydroid
  apk:
    name:
      - waydroid
#      - waydroid-sensors

- name: get the session uuid
  ansible.builtin.shell: >
    grep -Eo '^activityId=[0-9a-f-]+' /home/user/.config/plasma-org.kde.plasma.mobileshell-appletsrc | cut -d= -f2
  register: activity_id

- name: add my desktop layout
  template:
    src: plasma-org.kde.plasma.mobileshell-appletsrc.j2
    dest: /home/user/.config/plasma-org.kde.plasma.mobileshell-appletsrc
    owner: user
    group: user

- name: copy gui dimmer
  copy:
    src: 7H_Backlight
    dest: /usr/local/bin/7H_Backlight
    mode: 0755
- name: copy the command line dimmer
  copy:
    src: Raspi_USB_Backlight_nogui
    dest: /usr/local/bin/Raspi_USB_Backlight_nogui
    mode: 0755
- name: copy the icon
  copy:
    src: brightness.png
    dest: /home/user/Pictures/brightness.png
- name: copy the desktop shortcut
  copy:
    src: backlight.desktop
    dest: /usr/share/applications/backlight.desktop
- name: copy auto dimmer
  copy:
    src: dimmer.py
    dest: /usr/local/bin/dimmer.py
    mode: 0755
