---
- name: copy the script
  copy:
    src: set_gps_time.py
    dest: /usr/local/bin/
    mode: 0755
- name: copy the systemd unit
  copy:
    src: gps-time.service 
    dest: /etc/systemd/system/gps-time.service 
- name: Enable the gps-ntp service
  ansible.builtin.systemd:
      name: gps-time.service
      state: started
      enabled: yes
